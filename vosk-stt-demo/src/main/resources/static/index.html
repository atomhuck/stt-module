<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vosk — речь в текст в реальном времени</title>
  <style>
    :root{color-scheme:light dark}
    body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px}
    .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    button{padding:10px 20px;font-size:16px;border-radius:8px;border:1px solid #888;cursor:pointer}
    #toggle.on{background:#d33;color:#fff;border-color:#d33}
    #status{font-size:14px;opacity:.8}
    #meter{width:120px;height:8px;background:#8884;border-radius:4px;overflow:hidden}
    #level{height:100%;width:0;background:#2a9d4a;transition:width .08s}
    #box{margin-top:20px;min-height:180px;padding:16px;border:1px solid #8886;border-radius:10px;font-size:22px;line-height:1.5;overflow-y:auto;max-height:60vh}
    #partial{opacity:.55;font-style:italic}
  </style>
</head>
<body>
  <h1>Речь → текст в реальном времени</h1>
  <p><a href="/interview.html">→ Собеседование Java-Backend (вопросы, уточнения, оценка)</a></p>
  <div class="bar">
    <button id="toggle">🎤 Начать</button>
    <button id="clear">Очистить</button>
    <div id="meter"><div id="level"></div></div>
    <span id="status">Готов</span>
  </div>
  <div id="box"><span id="final"></span> <span id="partial"></span></div>

<script>
const $ = id => document.getElementById(id);
let ws, ctx, stream, node, running = false;

$('toggle').onclick = () => running ? stop() : start();
$('clear').onclick = () => { $('final').textContent = ''; $('partial').textContent = ''; };

async function start() {
  try {
    $('status').textContent = 'Запрашиваю микрофон…';
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });

    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/stt');
    ws.binaryType = 'arraybuffer';
    await new Promise((resolve, reject) => { ws.onopen = resolve; ws.onerror = () => reject(new Error('нет соединения с сервером')); });
    ws.onmessage = e => onResult(JSON.parse(e.data));
    ws.onclose = () => cleanup();

    ctx = new AudioContext();
    await ctx.audioWorklet.addModule('/pcm-worklet.js');
    const source = ctx.createMediaStreamSource(stream);
    node = new AudioWorkletNode(ctx, 'pcm-processor');
    node.port.onmessage = e => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(e.data);
      showLevel(new Int16Array(e.data));
    };
    const mute = ctx.createGain();          // узел нужно подключить к выходу, иначе Chrome его не вызывает
    mute.gain.value = 0;
    source.connect(node).connect(mute).connect(ctx.destination);

    running = true;
    $('toggle').textContent = '⏹ Стоп';
    $('toggle').classList.add('on');
    $('status').textContent = 'Слушаю… говорите';
  } catch (err) {
    $('status').textContent = 'Ошибка: ' + err.message;
    cleanup();
  }
}

function stop() {
  if (!running) return;
  running = false;
  $('status').textContent = 'Дорабатываю остаток…';
  stream && stream.getTracks().forEach(t => t.stop());
  if (ws && ws.readyState === WebSocket.OPEN) ws.send('eof');   // сервер вернёт финальный текст и закроет соединение
  setTimeout(() => ws && ws.readyState === WebSocket.OPEN && ws.close(), 3000);
}

function cleanup() {
  running = false;
  stream && stream.getTracks().forEach(t => t.stop());
  node && node.disconnect();
  ctx && ctx.state !== 'closed' && ctx.close();
  stream = node = ctx = null;
  $('toggle').textContent = '🎤 Начать';
  $('toggle').classList.remove('on');
  $('level').style.width = '0';
  if (!$('status').textContent.startsWith('Ошибка')) $('status').textContent = 'Готов';
}

function onResult(m) {
  if (m.type === 'partial') {
    $('partial').textContent = m.text;
  } else if (m.type === 'final') {
    $('partial').textContent = '';
    if (m.text) {
      const t = m.text.charAt(0).toUpperCase() + m.text.slice(1);
      $('final').textContent += ($('final').textContent ? ' ' : '') + t + '.';
    }
  }
  const box = $('box'); box.scrollTop = box.scrollHeight;
}

function showLevel(pcm) {
  let max = 0;
  for (let i = 0; i < pcm.length; i += 8) max = Math.max(max, Math.abs(pcm[i]));
  $('level').style.width = Math.min(100, (max / 32768) * 300) + '%';
}
</script>
</body>
</html>
