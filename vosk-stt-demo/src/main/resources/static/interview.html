<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Собеседование Java-Backend — в реальном времени</title>
  <style>
    :root{color-scheme:light dark;--card:#8881;--line:#8885}
    body{font-family:system-ui,sans-serif;max-width:900px;margin:32px auto;padding:0 16px}
    h1{font-size:24px;margin:0 0 16px}
    .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
    button,select{padding:9px 16px;font-size:15px;border-radius:8px;border:1px solid var(--line);cursor:pointer}
    button.primary{background:#2a6df4;color:#fff;border-color:#2a6df4}
    button:disabled{opacity:.45;cursor:default}
    #meter{width:100px;height:8px;background:var(--card);border-radius:4px;overflow:hidden}
    #level{height:100%;width:0;background:#2a9d4a;transition:width .08s}
    #status{font-size:14px;opacity:.75}
    .card{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0;background:var(--card)}
    #meta{font-size:13px;opacity:.7;margin-bottom:6px}
    #qtext{font-size:21px;line-height:1.4}
    .badge{display:inline-block;background:#e8a317;color:#000;border-radius:6px;padding:1px 8px;font-size:12px;margin-left:6px}
    #live{min-height:56px;font-size:19px;line-height:1.5}
    #live.empty{opacity:.45;font-style:italic}
    #log div{font-size:13px;font-family:ui-monospace,Consolas,monospace;padding:3px 0;border-bottom:1px dashed var(--line)}
    .score{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
    .score .box{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
    .score .num{font-size:28px;font-weight:700}
    #total{font-size:56px;font-weight:800}
    table{border-collapse:collapse;width:100%;font-size:13px}
    th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
    .hidden{display:none}
  </style>
</head>
<body>
  <h1>Собеседование Java-Backend</h1>

  <div class="bar" id="setup">
    <input id="candidate" placeholder="Имя кандидата (для отчёта)" maxlength="60" style="padding:9px 12px;font-size:15px;border-radius:8px;border:1px solid var(--line);width:230px">
    <select id="levels">
      <option value="ALL">Все уровни (50 вопросов)</option>
      <option>Стажёр</option><option>Junior</option><option>Middle</option><option>Senior</option>
    </select>
    <label><input type="checkbox" id="tts" checked> озвучивать вопросы</label>
    <label title="Микрофон открыт уже во время озвучки вопроса: можно начинать отвечать, не дожидаясь конца. Нужны наушники — иначе микрофон услышит колонки."><input type="checkbox" id="phones"> 🎧 я в наушниках</label>
    <button class="primary" id="start">🎤 Начать собеседование</button>
  </div>
  <div class="bar" id="voiceBar">
    <label>Голос: <select id="voice" style="max-width:340px"></select></label>
    <label>скорость <input type="range" id="rate" min="0.7" max="1.3" step="0.05" value="1"> <span id="rateVal">1.0</span></label>
    <button id="voiceTest">▶ Проверить голос</button>
  </div>
  <div style="font-size:12px;opacity:.65;margin:-6px 0 12px">
    Самые приятные — «Natural/Online» (в Microsoft Edge: Svetlana, Dmitry; нужен интернет). Английские термины озвучиваются русским произношением.
  </div>
  <div class="bar hidden" id="controls">
    <button id="skip">⏭ Пропустить вопрос</button>
    <button id="finish">🏁 Завершить и показать оценку</button>
    <div id="meter"><div id="level"></div></div>
    <span id="status">…</span>
  </div>

  <div id="warn" class="hidden" style="background:#fdecea;color:#b71c1c;border:1px solid #f5c6cb;border-radius:10px;padding:10px 14px;margin:8px 0;font-size:14px"></div>

  <div id="interview" class="hidden">
    <div class="card">
      <div id="meta"></div>
      <div id="qtext"></div>
    </div>
    <div class="card">
      <div style="font-size:13px;opacity:.7;margin-bottom:4px">Ваш ответ (распознаётся на лету)</div>
      <div id="live" class="empty">говорите…</div>
    </div>
    <div class="card"><div style="font-size:13px;opacity:.7;margin-bottom:6px">Решения системы</div><div id="log"></div></div>
  </div>

  <div id="reportBox" class="hidden"></div>

<script>
const $ = id => document.getElementById(id);
const ACTIONS = {ASK_FOLLOW_UP: '↪ уточнение', NEXT_QUESTION: '→ следующий вопрос', FINISH: '🏁 конец списка'};
const REASONS = {sufficient: 'ответ достаточный', needs_detail: 'не хватает деталей', ignorance: '«не знаю» — не давим',
  no_answer: 'ответа нет', no_signal: 'почти ничего не сказано', off_topic: 'ответ не по теме',
  follow_up_budget: 'лимит уточнений', stagnation: 'уточнение не помогло', no_follow_ups: 'уточнения закончились'};
let ws, ctx, stream, node, canSend = false;
let voices = [], currentUtterance = null;
let epoch = 0, graceTimer = null, pendingQ = null;   // epoch отменяет устаревшие таймеры озвучки и «готов»

// ---------- голос озвучки ----------
function rankVoice(v) {
  const n = (v.name + ' ' + v.voiceURI).toLowerCase();
  if (!v.lang.toLowerCase().startsWith('ru')) return -1000;
  let s = 0;
  if (n.includes('natural')) s += 100;          // нейронные голоса Edge: «Microsoft Svetlana Online (Natural)»
  if (n.includes('neural')) s += 80;
  if (n.includes('online')) s += 40;
  if (n.includes('google')) s += 30;            // «Google русский» в Chrome
  if (n.includes('svetlana')) s += 12;
  if (n.includes('dmitry')) s += 10;
  if (n.includes('milena') || n.includes('yuri')) s += 5;   // macOS
  if (!v.localService) s += 5;
  return s;
}
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  voices = speechSynthesis.getVoices().slice().sort((a, b) => rankVoice(b) - rankVoice(a));
  const sel = $('voice'); sel.replaceChildren();
  voices.forEach(v => {
    const o = document.createElement('option');
    o.value = v.name;
    o.textContent = v.name + ' · ' + v.lang + (v.localService ? '' : ' · онлайн');
    sel.append(o);
  });
  let saved = null; try { saved = localStorage.getItem('voice'); } catch (e) {}
  const pick = voices.find(v => v.name === saved) || voices[0];
  if (pick) sel.value = pick.name;
}
if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
$('voice').onchange = () => { try { localStorage.setItem('voice', $('voice').value); } catch (e) {} };
$('rate').oninput = () => { $('rateVal').textContent = (+$('rate').value).toFixed(2); try { localStorage.setItem('rate', $('rate').value); } catch (e) {} };
try { const r = localStorage.getItem('rate'); if (r) { $('rate').value = r; $('rateVal').textContent = (+r).toFixed(2); } } catch (e) {}
$('voiceTest').onclick = () => speak('Здравствуйте! Это проверка голоса. Что такое хэшмэп, и чем он отличается от джей-ви-эм?');

function speak(text, onDone) {
  if (!('speechSynthesis' in window)) { onDone && onDone(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = voices.find(x => x.name === $('voice').value);
  if (v) { u.voice = v; u.lang = v.lang; } else { u.lang = 'ru-RU'; }
  u.rate = +$('rate').value;
  if (onDone) { u.onend = onDone; u.onerror = onDone; }
  currentUtterance = u;                         // держим ссылку: иначе браузер может «съесть» событие onend
  speechSynthesis.speak(u);
}

function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }
function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

$('start').onclick = start;
$('skip').onclick = () => { if (pendingQ) return; canSend = false; speechSynthesis && speechSynthesis.cancel(); send({type: 'skip'}); };
$('finish').onclick = () => { canSend = false; speechSynthesis && speechSynthesis.cancel(); send({type: 'stop'}); };

async function start() {
  try {
    $('start').disabled = true;
    stream = await navigator.mediaDevices.getUserMedia({audio: {channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/interview');
    ws.binaryType = 'arraybuffer';
    await new Promise((res, rej) => { ws.onopen = res; ws.onerror = () => rej(new Error('нет соединения с сервером')); });
    ws.onmessage = e => onMessage(JSON.parse(e.data));
    ws.onclose = () => { cleanup(); };

    ctx = new AudioContext();
    await ctx.audioWorklet.addModule('/pcm-worklet.js');
    const src = ctx.createMediaStreamSource(stream);
    node = new AudioWorkletNode(ctx, 'pcm-processor');
    node.port.onmessage = e => {
      if (!canSend || ws.readyState !== WebSocket.OPEN) return;
      ws.send(e.data);
      const pcm = new Int16Array(e.data); let max = 0;
      for (let i = 0; i < pcm.length; i += 8) max = Math.max(max, Math.abs(pcm[i]));
      $('level').style.width = Math.min(100, max / 32768 * 300) + '%';
    };
    const mute = ctx.createGain(); mute.gain.value = 0;
    src.connect(node).connect(mute).connect(ctx.destination);

    $('setup').classList.add('hidden');
    $('controls').classList.remove('hidden');
    $('interview').classList.remove('hidden');
    const lv = $('levels').value;
    send({type: 'start', levels: lv === 'ALL' ? [] : [lv], candidate: $('candidate').value.trim()});
  } catch (err) {
    $('start').disabled = false;
    alert('Не удалось начать: ' + err.message);
    cleanup();
  }
}

function onMessage(m) {
  switch (m.type) {
    case 'question': onQuestion(m); break;
    case 'retract': onRetract(m); break;
    case 'warning': showWarning(m); break;
    case 'partial': { const l = $('live'); l.textContent = m.text || 'говорите…'; l.classList.toggle('empty', !m.text); break; }
    case 'decision': showDecision(m); break;
    case 'report': showReport(m.report, m); break;
    case 'refined': showRefined(m); break;
    case 'finalizing': $('status').textContent = m.message; break;
    case 'error': $('status').textContent = 'Ошибка: ' + m.message; break;
  }
}

// Следующий вопрос приходит сразу вместе с решением, но показываем и озвучиваем его только после «окна отмены»
// (m.graceMs): всё это время микрофон открыт, и если вы продолжите отвечать, сервер отменит решение.
function onQuestion(m) {
  clearTimeout(graceTimer);
  const my = ++epoch;
  if (m.graceMs > 0) {
    pendingQ = m;
    canSend = true;                               // микрофон открыт: человек мог не договорить
    $('status').textContent = '⏳ Решение принято — на случай, если вы ещё не договорили, ждём секунду…';
    graceTimer = setTimeout(() => { if (epoch === my) { pendingQ = null; applyQuestion(m, my); } }, m.graceMs);
  } else {
    pendingQ = null;
    applyQuestion(m, my);
  }
}

function renderQuestion(m) {
  $('live').textContent = 'говорите…'; $('live').classList.add('empty');
  $('meta').textContent = `Вопрос ${m.number} из ${m.total} · ${m.level} · ${m.topic}`;
  const q = $('qtext'); q.textContent = m.text;
  if (m.followUp) q.append(el('span', 'уточняющий вопрос ' + m.followUpNumber, 'badge'));
}

function applyQuestion(m, my) {
  canSend = false;                                // пока звучит вопрос, микрофон закрыт (иначе он услышит колонки)
  renderQuestion(m);
  $('status').textContent = 'Слушайте вопрос…';
  speakThenReady(m.spoken || m.text, my);
}

function speakThenReady(text, my) {
  let done = false;
  const ready = () => {
    if (done || epoch !== my) return;             // вопрос уже отменён или заменён
    done = true; canSend = true;
    $('status').textContent = '🎙 Слушаю — отвечайте';
    send({type: 'ready'});
  };
  if (!$('tts').checked || !('speechSynthesis' in window)) { setTimeout(ready, 250); return; }
  if ($('phones').checked) {
    // наушники: слушаем сразу, а время озвучки не засчитываем в «скорость ответа»
    const t0 = Date.now();
    ready();
    speak(text, () => { if (epoch === my) send({type: 'tts_end', afterMs: Date.now() - t0}); });
    return;
  }
  setTimeout(ready, 4000 + text.length * 110);    // страховка, если озвучка не сработала
  speak(text, ready);
}

// Вы продолжили отвечать, пока система «принимала решение»: решение отменено, следующий вопрос не показываем.
function onRetract(m) {
  epoch++; clearTimeout(graceTimer); pendingQ = null;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  canSend = true;
  if (m.question) renderQuestion(m.question);     // если следующий вопрос уже успел появиться — возвращаем прежний
  $('live').classList.remove('empty');
  $('status').textContent = '🎙 Слушаю — продолжайте отвечать';
  const row = el('div', '↩ вы продолжили отвечать — решение отменено, ответ принимается дальше');
  row.style.color = '#b26a00';
  $('log').prepend(row);
}

function showWarning(m) {
  const w = $('warn');
  w.textContent = '⚠ ' + m.message;
  w.classList.remove('hidden');
  setTimeout(() => w.classList.add('hidden'), 20000);
}

function showDecision(m) {
  const t = m.timing;
  if (m.action === 'FINISH') $('status').textContent = '⏳ Последний ответ принят — собираю итоги…';
  const line = `${ACTIONS[m.action] || m.action}: ${REASONS[m.reason] || m.reason} · покрытие ${m.coveragePercent}% · `
    + `${m.answerWords} слов · решение через ${t.serverMs} мс (тишина ${t.silenceMs} мс + расчёт ${t.decisionMicros} мкс)`;
  const row = el('div', line);
  if (m.recognized) row.append(el('div', '«' + m.recognized + '»', ''));
  row.lastChild && m.recognized && (row.lastChild.style.opacity = '.7');
  $('log').prepend(row);
}

function showRefined(m) {
  const row = el('div', '✎ уточнено (Whisper): «' + m.text + '»');
  row.style.color = '#2a9d4a';
  $('log').prepend(row);
}

function showReport(r, msg) {
  cleanup();
  $('interview').classList.add('hidden'); $('controls').classList.add('hidden');
  const box = $('reportBox'); box.replaceChildren(); box.classList.remove('hidden');

  const head = el('div', undefined, 'card'); head.style.textAlign = 'center';
  head.append(el('div', 'Итоговая оценка (из 10)'), el('div', r.totalText, ''), el('div', r.verdict));
  head.children[1].id = 'total';
  if (r.finishedEarly) head.append(el('div', `Досрочное завершение: отвечено ${r.answeredQuestions} из ${r.plannedQuestions}`));
  box.append(head);

  if (msg && msg.excel) {
    const x = el('div', undefined, 'card');
    x.append(el('div', '📄 Excel-отчёт сохранён на сервере: ' + msg.excel.path));
    if (msg.excel.url) {
      const a = document.createElement('a');
      a.href = msg.excel.url; a.textContent = '⬇ Скачать ' + msg.excel.file; a.setAttribute('download', msg.excel.file);
      a.style.cssText = 'display:inline-block;margin-top:8px;font-weight:600';
      x.append(a);
    }
    box.append(x);
  } else if (msg && msg.excelError) {
    box.append(el('div', '⚠ Excel-отчёт не создан: ' + msg.excelError, 'card'));
  }

  const sc = el('div', undefined, 'card score');
  for (const [name, v] of [['Развёрнутость и полнота', r.completeness], ['Техническая грамотность', r.technical],
                           ['IT-термины и сленг', r.terminology], ['Скорость ответа', r.speed]]) {
    const b = el('div', undefined, 'box'); b.append(el('div', name), el('div', v.toFixed(2), 'num'), el('div', 'из 10'));
    sc.append(b);
  }
  box.append(sc);

  const tb = document.createElement('table');
  const hr = tb.insertRow();
  for (const h of ['#', 'Уровень / тема', 'Вопрос', 'Покрытие', 'Полнота', 'Техника', 'Термины', 'Скорость', 'Не прозвучало']) hr.append(el('th', h));
  r.questions.forEach(q => {
    const row = tb.insertRow();
    [q.number, `${q.level} · ${q.topic}`, q.question + (q.attempts > 1 ? ` (+${q.attempts - 1} уточн.)` : ''), q.coveragePercent + '%',
     q.completeness.toFixed(1), q.technical.toFixed(1), q.terminology.toFixed(1), q.speed.toFixed(1), q.missing.join(', ')]
      .forEach(v => row.insertCell().textContent = v);
  });
  const wrap = el('div', undefined, 'card'); wrap.style.overflowX = 'auto'; wrap.append(tb);
  box.append(wrap);
  const again = el('button', 'Пройти заново', 'primary'); again.onclick = () => location.reload();
  box.append(again);
}

function cleanup() {
  canSend = false;
  epoch++; clearTimeout(graceTimer); pendingQ = null;
  stream && stream.getTracks().forEach(t => t.stop());
  node && node.disconnect();
  ctx && ctx.state !== 'closed' && ctx.close();
  stream = node = ctx = null;
}
</script>
</body>
</html>
